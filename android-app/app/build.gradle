plugins { id 'com.android.application' }

// Qt ships QtActivity/QtLoader/QtApplication as *Java source* under
//   $QT_ANDROID/src/android/java/src
// while the prebuilt Qt6Android.jar only carries org.qtproject.qt.android.*
// (QtNative and friends). Qt's own androiddeployqt compiles these sources into the
// app, so we do the same here.
def qtAndroidRoot = System.getenv("QT_ANDROID_DIR") ?:
        "${System.getProperty("user.home")}/freecad-android/Qt/6.6.3/android_arm64_v8a"

android {
    namespace = "org.freecad.android"
    compileSdk = 35

    defaultConfig {
        applicationId = "org.freecad.android"
        minSdk = 31
        targetSdk = 35
        versionCode = 1
        versionName = "0.1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            // 我们的 native 库（FreeCAD + OCCT + Qt + Python）
            jniLibs.srcDirs = ['../jniLibs']
            // Qt 的 Java 引导源码
            java.srcDirs += "${qtAndroidRoot}/src/android/java/src"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    androidResources {
        // The CPython extension modules travel as assets; keep them stored so
        // extraction is a straight copy.
        noCompress 'so', 'zip'
    }

    buildTypes {
        debug   { minifyEnabled false }
        release { minifyEnabled false; signingConfig = signingConfigs.debug }
    }
}

dependencies {
    implementation files('libs/Qt6Android.jar')
    implementation 'androidx.annotation:annotation:1.9.1'
}
